# CI/CD Pipeline for the Flask app
#
# CI  — runs on every push and pull request: Python tests + Node syntax check.
# CD  — on pushes to `main`: builds the Docker image, pushes it to GHCR
#       (GitHub Container Registry), and deploys (placeholder step).
#
# Required GitHub settings (none needed — GHCR uses the built-in GITHUB_TOKEN):
#   Settings > Actions > General > Workflow permissions >
#     "Read and write permissions" must be enabled for package pushes.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # ---------- Continuous Integration ----------
  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest test_app.py -v

  test-node:
    name: Check (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check server entrypoints
        run: |
          node --check server.js
          node --check stocks.js

  # ---------- Continuous Deployment ----------
  deploy:
    name: Build & Deploy (Docker -> GHCR)
    needs: [test-python, test-node]
    # Only run CD on the main branch, never on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Replace this with your real deployment (e.g. SSH to a server,
      # kubectl apply, or a cloud provider's action).
      - name: Deploy (placeholder)
        run: |
          echo "Image pushed: ghcr.io/${{ github.repository }}:latest"
          echo "Add your real deployment step here."
